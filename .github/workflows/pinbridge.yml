name: Pinbridge C firmware (AC6956C / BR23)

on:
  push:
    branches: [pinbridge]
  pull_request:
    branches: [pinbridge]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinbridge-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-check:
    name: Check Bun TBP host
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install pinned host dependencies
        working-directory: host/pinbridge/bun
        run: bun install --frozen-lockfile
      - name: Format-check and test Bun host
        working-directory: host/pinbridge/bun
        run: bun run check
      - name: Syntax-check the host server
        working-directory: host/pinbridge/bun
        run: bun build --target=bun --external serialport --external @serialport/parser-readline --outdir "$RUNNER_TEMP/pinbridge-host-check" server.ts

  firmware:
    name: Build and package app.bin
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      JL_HOME: ${{ github.workspace }}/.ci/jl
      SDK_REV: fdc018de81629e21e594d677cf05f87d288be0f0
      TOOLCHAIN_SHA256: a1545cddbc451a06bac43eb5cd96d831470c42a97c5c0b1f98879a20fc7647bd
      POSTBUILD_SHA256: 6949d48c4cd82e274d7943d4ca67f214593fdb4f699ef9f51c2ecc78125ab739

    steps:
      - uses: actions/checkout@v4

      - name: Restore pinned vendor downloads
        id: vendor-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci/downloads
          key: jieli-linux-${{ runner.os }}-${{ runner.arch }}-${{ env.TOOLCHAIN_SHA256 }}-${{ env.POSTBUILD_SHA256 }}

      - name: Restore pinned SDK mirror
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci/jl/fw-AC63_BT_SDK/.git
          key: jieli-ac63-sdk-${{ env.SDK_REV }}

      - name: Install build dependencies and pinned JieLi tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends make patch python3 xz-utils faketime
          mkdir -p .ci/downloads
          if [ ! -s .ci/downloads/toolchain.tar.xz ]; then
            curl -fLsS --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain -o .ci/downloads/toolchain.tar.xz
          fi
          echo "$TOOLCHAIN_SHA256  .ci/downloads/toolchain.tar.xz" | sha256sum -c -
          if [ ! -s .ci/downloads/postbuild.tar.xz ]; then
            curl -fLsS --retry 3 https://pkgman.jieliapp.com/s/linux-postbuild -o .ci/downloads/postbuild.tar.xz
          fi
          echo "$POSTBUILD_SHA256  .ci/downloads/postbuild.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/jieli /opt/utils
          sudo tar -xJf .ci/downloads/toolchain.tar.xz --strip-components=1 -C /opt/jieli
          sudo tar -xJf .ci/downloads/postbuild.tar.xz --strip-components=1 -C /opt/utils

      # Save before the firmware build, so a link failure cannot waste these downloads.
      - name: Cache pinned vendor downloads
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci/downloads
          key: ${{ steps.vendor-cache.outputs.cache-primary-key }}

      - name: Fetch pinned AC63 SDK on cache miss
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mirror="$JL_HOME/fw-AC63_BT_SDK"
          git init -q "$mirror"
          git -C "$mirror" remote add origin https://github.com/Jieli-Tech/fw-AC63_BT_SDK.git
          git -C "$mirror" fetch -q --depth 1 origin "$SDK_REV"
          git -C "$mirror" branch pinbridge-cache "$SDK_REV"
          git -C "$mirror" symbolic-ref HEAD refs/heads/pinbridge-cache
          test "$(git -C "$mirror" rev-parse HEAD)" = "$SDK_REV"

      - name: Cache pinned SDK mirror before firmware build
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci/jl/fw-AC63_BT_SDK/.git
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

      - name: Build C firmware with existing build script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/out/pinbridge
          MAKEFLAGS=-j2 sh scripts/build-app.sh pinbridge "$GITHUB_WORKSPACE/.ci/out/pinbridge"
          test -s .ci/out/pinbridge/app.bin
          sha256sum .ci/out/pinbridge/app.bin .ci/out/pinbridge/sdk.elf > .ci/out/pinbridge/SHA256SUMS

      - name: Upload firmware or build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinbridge-br23-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            .ci/out/pinbridge/app.bin
            .ci/out/pinbridge/sdk.elf
            .ci/out/pinbridge/sdk.map
            .ci/out/pinbridge/SHA256SUMS
            .ci/out/pinbridge/BUILD-INFO.txt
            .ci/out/pinbridge/build.log
