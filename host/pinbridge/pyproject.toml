[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "pinbridge"
version = "0.1.0"
description = "Python host for the JieLi jlpin USB CDC pin server"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5", "aiohttp>=3.9"]

[tool.setuptools.package-data]
pinbridge = ["web/*.html", "web/*.css", "web/*.js"]
[tool.setuptools.packages.find]
where = ["."]
