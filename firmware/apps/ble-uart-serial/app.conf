# ble-uart-serial: USB CDC serial port <-> BLE bridge (GATT service af30: ae01 write -> PC, PC -> ae02 notify).
# Variant A of the BLE vs Classic-SPP comparison; see README.md. Name: JL-UART-BLE.
# Format: see firmware/apps/hello-cdc/app.conf. Overlay files (generated by patch/gen_overlay.py)
# replace whole SDK files; the shared core src/uart_bridge.{c,h} is byte-identical in both variants.

target  ac635n_spp_and_le

# default app (CONFIG_APP_SPP_LE 1, trans_data example): no app_config set lines needed.

# Bluetooth: BLE only
set  apps/spp_and_le/board/br23/board_ac635n_demo_cfg.h  TCFG_USER_BLE_ENABLE  1
set  apps/spp_and_le/board/br23/board_ac635n_demo_cfg.h  TCFG_USER_EDR_ENABLE  0

# 512 KiB flash
set  apps/spp_and_le/board/br23/board_ac635n_demo_global_build_cfg.h  CONFIG_FLASH_SIZE  FLASH_SIZE_512K

# USB CDC (as hello-cdc)
set  apps/spp_and_le/board/br23/board_ac635n_demo_cfg.h  TCFG_PC_ENABLE  ENABLE_THIS_MOUDLE
set  apps/spp_and_le/board/br23/board_ac635n_demo_cfg.h  USB_DEVICE_CLASS_CONFIG  CDC_CLASS

# SDK UART0 log on PA0 off (owner decision); logs go to the CDC port through the core
set  apps/spp_and_le/board/br23/board_ac635n_demo_cfg.h  TCFG_UART0_ENABLE  DISABLE_THIS_MOUDLE

# shared core: reuses an SDK source file that is in the fixed Makefile list but unused here
copy  src/uart_bridge.c  apps/spp_and_le/examples/nonconn_24g/ble_24g_deal.c
copy  src/uart_bridge.h  apps/spp_and_le/include/uart_bridge.h
