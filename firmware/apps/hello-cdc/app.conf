# hello-cdc: USB CDC serial port that prints "hello world 1", "hello world 2", ... once a second.
# The chip shows up on the PC as a virtual COM port (/dev/ttyACM0). No Bluetooth, no audio.
# Also toggles PC7 as a heartbeat. Uses the chip's USB DP/DM pins, no GPIO pin to choose.
#
# Format (parsed by scripts/apply_app.py):
#   target <make target>             top-level Makefile target of the SDK
#   set <file> <MACRO> <value>       replace the value of "#define MACRO value"
#                                    in <file> (path relative to the SDK root);
#                                    exactly one such #define must exist
#   copy <src> <sdk path>            copy <src> (relative to this directory) over
#                                    <sdk path> (relative to the SDK root)
# Files under overlay/ (if present) are also copied over the SDK, same relative paths.
#
# YOUR CODE IS src/app.c. It replaces the SDK's "idle" example (see the copy line below).

target  ac635n_spp_and_le

# run the "idle" example instead of spp_and_le
set  apps/spp_and_le/include/app_config.h  CONFIG_APP_SPP_LE  0
set  apps/spp_and_le/include/app_config.h  CONFIG_APP_IDLE    1

# the idle app refuses to build with Bluetooth enabled (#error in app_idle.c)
set  apps/spp_and_le/board/br23/board_ac635n_demo_cfg.h  TCFG_USER_BLE_ENABLE  0

# the printer has a 512 KiB flash (the SDK default is 1 MiB)
set  apps/spp_and_le/board/br23/board_ac635n_demo_global_build_cfg.h  CONFIG_FLASH_SIZE  FLASH_SIZE_512K

# USB device: turn the SDK's "PC module" on (this defines TCFG_USB_SLAVE_ENABLE) and make
# the only USB class a CDC serial port instead of the demo's speaker/mic/HID
set  apps/spp_and_le/board/br23/board_ac635n_demo_cfg.h  TCFG_PC_ENABLE  ENABLE_THIS_MOUDLE
set  apps/spp_and_le/board/br23/board_ac635n_demo_cfg.h  USB_DEVICE_CLASS_CONFIG  CDC_CLASS

# the application source: edit src/app.c, not the SDK file
copy  src/app.c  apps/spp_and_le/examples/idle/app_idle.c
